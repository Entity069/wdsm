name: Test Hello Example

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Stage (hello example)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jco
        run: npm install -g @bytecodealliance/jco

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build wdsm CLI
        run: cargo build --release --bin wdsm

      - name: Run Hello Server and Test Endpoint
        run: |
          ./target/release/wdsm deploy --config examples/hello/config.yml &
          SERVER_PID=$!
          
          # Wait for server readiness
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3001/__health | grep -q "ok"; then
              echo "Server is ready!"
              break
            fi
            sleep 0.5
          done

          RESPONSE=$(curl -s "http://127.0.0.1:3001/hello?name=World")
          echo "Response: $RESPONSE"
          
          kill $SERVER_PID || true
          
          if [[ "$RESPONSE" != *"World"* ]]; then
            echo "Expected response containing World, got: $RESPONSE"
            exit 1
          fi
