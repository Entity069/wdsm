[workspace]
members = [
    "cli",
    "parser",
    "jco",
    "server",
    "registry",
    "logger",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["entity069"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"